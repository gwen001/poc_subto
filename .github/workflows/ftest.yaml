name: 🧪 Test

on:
  pull_request_target:

jobs:
  demo6pr:
    environment: testenv
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Fake secret injection
        env:
          FAKE_SECRET: ${{ secrets.FAKE_SECRET }}
          FAKE_KEY: ${{ secrets.FAKE_KEY }}
          FAKE_VAR: ${{ variables.FAKE_VAR }}
        run: bash run.sh
